<!-- UI Template for Node-RED dashboard: Price Widget -->
<style>
/* Price Widget: Inherit TACTICAL CSS styling */
#price-chart-widget {
    background-color: transparent !important;
    color: inherit !important;
    font-family: inherit !important;
}
#price-chart-widget canvas {
    background-color: transparent !important;
}
</style>

<div id="price-chart-widget" style="width:100%;height:200px;min-height:180px;overflow:hidden"></div>

<script>
(function(scope) {
    var widgetId = 'price-chart-widget';
    var retryTimer = null;
    var nowLineInterval = null;
    var scriptLoadAttempts = 0;
    var MAX_SCRIPT_LOAD_ATTEMPTS = 3;
    
    // Load widget script with retry logic
    function loadWidgetScript() {
        if (window.PriceWidget) {
            console.log('[Price Widget] Already loaded');
            return;
        }
        
        if (scriptLoadAttempts >= MAX_SCRIPT_LOAD_ATTEMPTS) {
            console.error('[Price Widget] Max script load attempts reached');
            document.getElementById(widgetId).innerHTML = '<div style="color:#FF4136;padding:10px">Script load failed</div>';
            return;
        }
        
        scriptLoadAttempts++;
        console.log('[Price Widget] Loading script (attempt ' + scriptLoadAttempts + ')');
        
        var s = document.createElement('script');
        s.src = '/public/price-widget.js?v=' + Date.now(); // Cache-busting
        s.onload = function() { 
            console.log('[Price Widget] Script loaded successfully');
            scriptLoadAttempts = 0; // Reset on success
        };
        s.onerror = function() { 
            console.error('[Price Widget] Script load error, retry in 2s');
            setTimeout(loadWidgetScript, 2000);
        };
        document.head.appendChild(s);
    }
    
    // Start loading if not already present
    if (!window.PriceWidget) {
        loadWidgetScript();
    }
    
    // Update now-line every minute
    if (!nowLineInterval) {
        nowLineInterval = setInterval(function() {
            if (window.PriceWidget && window.PriceWidget.updateNowLine) {
                window.PriceWidget.updateNowLine(widgetId);
            }
        }, 60000); // 60 seconds
    }
    
    // Watch for incoming messages
    scope.$watch('msg', function(msg) {
        // Clear any pending retry
        if (retryTimer) {
            clearTimeout(retryTimer);
            retryTimer = null;
        }
        
        if (!msg || !msg.payload) {
            return;
        }
        
        // Filter: Only process array payloads (chart data)
        if (!Array.isArray(msg.payload)) {
            return;
        }
        
        // Render widget with exponential backoff
        function tryRender(attempt) {
            attempt = attempt || 0;
            
            if (window.PriceWidget && typeof window.PriceWidget.render === 'function') {
                console.log('[Price Widget] Rendering chart (attempt ' + attempt + ')');
                try {
                    window.PriceWidget.render(widgetId, msg.payload, { height: '200px' });
                } catch(e) {
                    console.error('[Price Widget] Render error:', e);
                    document.getElementById(widgetId).innerHTML = '<div style="color:#FF4136;padding:10px">Render error: ' + e.message + '</div>';
                }
            } else if (attempt < 100) { // Max 20 seconds with exponential backoff
                var delay = Math.min(100 * Math.pow(1.1, attempt), 2000); // 100ms → 2s
                retryTimer = setTimeout(function() { tryRender(attempt + 1); }, delay);
            } else {
                console.error('[Price Widget] Timeout waiting for script after ' + attempt + ' attempts');
                document.getElementById(widgetId).innerHTML = '<div style="color:#FF4136;padding:10px">Widget timeout</div>';
            }
        }
        
        tryRender(0);
    });
})(scope);
</script>
